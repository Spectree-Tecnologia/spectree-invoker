## Designing a judgment

Start from what the application will **show, select, change or hand off**, and work back to the judgments it needs. Known rules, calculations, exact lookups and execution stay in code; a judgment is for the part ordinary code cannot understand.

- **Pick the primitive by what the answer means**, then read its page: one of a defined set → *Choice*; whether a condition holds → *Noul*, one per label when several can hold; a degree along an ordered dimension → *Score*.
- **One narrow, coherent judgment per question.** Split dimensions that are independently useful; never split the relationship being judged.
- **Give each question the state it needs** — source text, identities, relationships, current facts — as named fields when there are several. The judgment goes in the instructions; the possible answers go in the criteria. Question ids are for code and never reach the model, so the question carries its whole meaning.
- **"Nothing fits" is an answer you design in.** When no option may apply, the criteria include it. When you select among candidates found by code, check coverage first: the model cannot choose a value you did not give it.
- **Independent questions over the same state go in one request**; a second request only when an earlier answer is needed to fetch evidence or build the next state.

**Probabilities guide behaviour; they do not grant permission.** Confidence summarises how concentrated a distribution is — not whether the workflow is correct, and never whether an action is allowed. A Noul near 0.5 means yes and no are about equally likely, not "medium". Low confidence spread across harmless alternatives need not block anything; uncertainty on a branch the code never uses is ignored.

## The calibration is the evidence

- **The evaluation set comes from the project's domain**, labelled, and includes the cases that should produce "nothing fits". A vendor demo or a cookbook's threshold is an example to evaluate, never a number to copy.
- **Tests and evaluation are different things, kept apart on purpose.** Every `Scenario` is proven by the Quality Engineer's and the Developer's tests **against the port**, with the judgment faked — deterministic, free, and runnable offline. The live model is exercised only by the evaluation. A unit test that calls the live model costs money on every run and turns the suite into a coin toss — and a green that exists because someone re-ran a red is a finding, not an approval.
- **Declare the spend before you run.** Your mission carries a request budget; the evaluation reports the requests it made, the cost where the API reports one, and the end-to-end latency. Over budget, you stop and report — you never shrink the evaluation set to fit.
- **When a case fails, say which kind of failure it is**: missing evidence in the state, a model error, a code error, or a service failure. They have different owners and different repairs, and "the model got it wrong" is only one of the four.


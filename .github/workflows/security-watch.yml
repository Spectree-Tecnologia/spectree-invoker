name: security-watch

# An advisory published today makes yesterday's green lockfile vulnerable without a single commit.
# The audit in `check` only runs when something is pushed, so this re-runs it every day against
# main as it stands. It gates nothing and publishes nothing: a red run here is the alarm, and the
# fix arrives as an ordinary change through `check`.
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          check-latest: true
      - name: install exactly the lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: dependency audit
        run: npm audit --audit-level=high

# Consumer blueprint. Adapt the runtime and commands; requires package-lock.json.
# Configure `required` as a required branch check. Do not install automatically.
name: Consumer checks
# A pull request and its merge into main. A push to a working branch with an open PR would run
# the same commit twice.
on:
  pull_request:
  push:
    branches: [main]
# A newer push makes the older run obsolete; cancel it instead of paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Pin the release and its SHA-256 from the gitleaks checksums file; see this repository's check.yml.
      - name: secret scan over the whole history
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -eu
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact .
  tests:
    runs-on: ubuntu-latest
    env:
      # One per run. Put it in the test database or schema name (app_test_$SPECTREE_TEST_NAMESPACE);
      # a fixed name like app_test is shared by every run that overlaps.
      SPECTREE_TEST_NAMESPACE: ci_${{ github.run_id }}_${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The whole suite ONCE, as TAP. Every check that names its tests is judged from this one
      # report; never re-run the suite per check or per Requirement. Archived changes get no step
      # of their own: their tests are already in the suite.
      - run: npm test -- --test-reporter=tap --test-reporter-destination=suite.tap --test-reporter=spec --test-reporter-destination=stdout
      - name: judge the open changes' checks from that report
        run: |
          set -eu
          for plan in docs/changes/*/verification.json; do
            [ -e "$plan" ] || continue
            node .spectree/squad/scripts/verification.mjs checks "$plan" suite.tap
          done
  required:
    if: ${{ always() }}
    needs: [audit, secrets, tests]
    runs-on: ubuntu-latest
    steps:
      - name: Every required job must succeed
        env:
          AUDIT_RESULT: ${{ needs.audit.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
          TEST_RESULT: ${{ needs.tests.result }}
        run: |
          test "$AUDIT_RESULT" = success
          test "$SECRETS_RESULT" = success
          test "$TEST_RESULT" = success
